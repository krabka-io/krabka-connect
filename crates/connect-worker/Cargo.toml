[package]
name = "krabka-connect-worker"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Managed single-connector Postgres CDC worker for Krabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-connect-worker"
readme = "README.md"
keywords = ["kafka", "connect", "postgres", "cdc", "krabka"]
categories = ["database", "network-programming"]

[lints]
workspace = true

[[bin]]
name = "krabka-connect-worker"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
krabka-client-core = { workspace = true }
krabka-client-producer = { workspace = true }
krabka-connect = { version = "0.4.0", path = "../connect" }
krabka-connect-postgres = { version = "0.4.0", path = "../connect-postgres" }
krabka-replicator = { version = "0.4.0", path = "../replicator" }
krabka-security = { workspace = true }
krabka-units = { workspace = true }
prometheus-client = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
axum = { workspace = true }
krabka-broker = { workspace = true, features = ["test-helpers"] }
krabka-client-consumer = { workspace = true }
krabka-schema-registry = { git = "https://github.com/krabka-io/krabka-schema-registry", rev = "ae9876d15da12e6123b77b4fc77f50bb9d162556" }
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio-postgres = { workspace = true }
tower = { workspace = true, features = ["util"] }
