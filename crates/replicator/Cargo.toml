[package]
name = "crabka-replicator"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Cross-cluster geo-replication service for Crabka (MirrorMaker-2 equivalent)"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/crabka-replicator"
keywords = ["kafka", "replication", "mirrormaker", "crabka"]
categories = ["network-programming"]

[lints]
workspace = true

[[bin]]
name = "crabka-replicator"
path = "src/main.rs"

[dependencies]
assert2 = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
crabka-connect = { version = "0.4.0", path = "../connect" }
crabka-ids = { workspace = true }
crabka-client-core = { workspace = true }
crabka-client-consumer = { workspace = true }
crabka-client-producer = { workspace = true }
crabka-client-admin = { workspace = true }
crabka-logfmt = { workspace = true }
crabka-security = { workspace = true }
crabka-units = { workspace = true }
derive_more = { workspace = true }
qubit-clock = { workspace = true, features = ["tokio"] }
regex = { workspace = true }
refined_type = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }
tempfile = { workspace = true }
crabka-broker = { workspace = true, features = ["test-helpers"] }
