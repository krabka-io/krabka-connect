[workspace]
resolver = "2"
members = ["crates/*"]
# tools/mutants pins cargo-mutants from its own lockfile so the sweep tool is
# versioned independently of what the crates under test depend on. It is not a
# member: cargo refuses a manifest that sits under a workspace root without
# belonging to it.
exclude = ["tools/mutants"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
rust-version = "1.97.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Intentional while the public API is still pre-1.0; re-evaluate once the
# API surfaces stabilise.
clone_on_copy = "warn"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
anyhow = "1"
assert2 = "0.4"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
datatest-stable = "0.3.3"
derive_more = { version = "2", features = ["display", "from", "into", "deref", "as_ref", "constructor", "from_str", "add", "add_assign", "mul", "sum"] }
futures-util = { version = "0.3", features = ["sink"] }
mockall = "0.15"
mutants = "0.0.4"
postgres-types = "0.2"
proc-macro-crate = "3"
proc-macro2 = "1"
prometheus-client = "0.25"
prost = "0.14"
prost-reflect = "0.16"
qubit-clock = "~0.8.1"
quote = "1"
refined_type = "0.6"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
syn = { version = "3", features = ["full", "extra-traits"] }
tempfile = "3"
testcontainers = "0.28"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-postgres = "0.7"
tokio-util = { version = "0.7", default-features = false }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
trybuild = "1"
# Sibling repositories. Declared against crates.io here and in the member
# manifests; the patch table below is the single place a revision is bumped.
krabka-ids = "0.4.0"
krabka-security = "0.4.0"
krabka-units = "0.4.0"
krabka-client-admin = "0.4.0"
krabka-client-consumer = "0.4.0"
krabka-client-core = "0.4.0"
krabka-client-producer = "0.4.0"
krabka-logfmt = "0.4.0"
krabka-broker = "0.4.0"
krabka-schema-serde = "0.4.0"

# Every crate each sibling publishes is listed, not only the ones this repo
# names directly: cargo ignores a dependency's own patch table, so a crate
# reached transitively would otherwise come from the registry while its git
# twin is also in the graph.
#
# Cargo warns that the entries this repo does not currently reach are unused.
# That is expected and the entries stay. None of these crates is on crates.io
# today, so a missing patch fails loudly rather than resolving to a registry
# copy -- but the moment one is published, a gap here becomes a silent
# substitution instead, which is the failure this table exists to prevent.
[patch.crates-io]
krabka-compression = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-ids = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-kafka-tap = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-metadata = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-protocol = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-security = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-trace-context = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-units = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-voters = { git = "https://github.com/krabka-io/krabka-protocol", rev = "dea9f7613cf078d1b4be421562e3cbaefb5346c2" }
krabka-client-admin = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "056e7e3eddb7da2ba21c7893993897e6169bc8f2" }
krabka-client-consumer = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "056e7e3eddb7da2ba21c7893993897e6169bc8f2" }
krabka-client-core = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "056e7e3eddb7da2ba21c7893993897e6169bc8f2" }
krabka-client-producer = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "056e7e3eddb7da2ba21c7893993897e6169bc8f2" }
krabka-audit = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-authz = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-broker = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-format = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-kraft-core = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-log = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-logfmt = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-object-store = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-raft = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-records-legacy = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-remote-storage = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-remote-storage-topic = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-telemetry = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-throttle = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-verified = { git = "https://github.com/krabka-io/krabka-broker", rev = "32dd555ec1b7bf9d82b4b7bcdb0c9332f7029617" }
krabka-client-streams = { git = "https://github.com/krabka-io/krabka-streams-rs", rev = "bd1f360" }
# Resolved from krabka-schema-registry rather than krabka-streams-rs: the two
# repos ship diverged copies of this crate, and `krabka-broker`'s schema
# validation needs the registry's API (`format::validate`,
# `RegistryClient::subject_versions_for_id`, `FetchedSchema::kind`).
krabka-schema-serde = { git = "https://github.com/krabka-io/krabka-schema-registry", rev = "ee9c3933fb1d71735846e7e5e33ea6ab3a694dc5" }
