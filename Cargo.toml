crabka-records-legacy = { git = "https://github.com/krabka-io/krabka-broker", rev = "e516a87c135bd87313283f8d38a3722e16912ba6" }
crabka-remote-storage = { git = "https://github.com/krabka-io/krabka-broker", rev = "e516a87c135bd87313283f8d38a3722e16912ba6" }
