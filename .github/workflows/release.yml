name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/krabka-io/krabka-connect-worker

jobs:
  # A release promotes an image that main CI already tested and pushed. This
  # job checks that the tagged commit is on main, and that a push run of ci.yml
  # passed for that commit. It gives that run's ID to `release`, which reads the
  # image digest from the run's `delivery-image` artifact.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      delivery_run: ${{ steps.main-ci.outputs.delivery_run }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: the tagged commit is on main
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "${GITHUB_REF_NAME} names ${GITHUB_SHA}, which is not an ancestor of origin/main." >&2
            echo 'Cut a release from a commit that merged into main.' >&2
            exit 1
          fi

      # A `pull_request` run tested the merge of the pull request into main,
      # which is a different tree. Only a successful `push` run counts.
      - name: main CI succeeded for this commit
        id: main-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs="$(gh run list --workflow ci.yml --commit "${GITHUB_SHA}" \
            --branch main --limit 100 --json conclusion,event,url,databaseId)"
          jq -r '.[] | "\(.conclusion)\t\(.event)\t\(.url)"' <<<"${runs}"
          delivery_run="$(jq -r '[.[] | select(.event == "push" and .conclusion == "success")][0].databaseId // empty' <<<"${runs}")"
          if [ -z "${delivery_run}" ]; then
            echo "No successful push run of ci.yml for ${GITHUB_SHA}." >&2
            echo 'Only a commit whose main CI run passed can be released.' >&2
            exit 1
          fi
          echo "delivery_run=${delivery_run}" >>"${GITHUB_OUTPUT}"

  release:
    name: release
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit tag in the registry can move. The digest that the delivery
      # run recorded cannot, so the release promotes that digest.
      - name: resolve the tested delivery image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_RUN: ${{ needs.verify.outputs.delivery_run }}
        run: |
          gh run download "${DELIVERY_RUN}" --name delivery-image --dir delivery-image
          digest="$(tr -d '[:space:]' <delivery-image/delivery-image.digest)"
          actual="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" |
            awk '$1 == "Digest:" { print $2; exit }')"
          if [ "${actual}" != "${digest}" ]; then
            echo "${IMAGE}:${GITHUB_SHA} is ${actual}, but CI run ${DELIVERY_RUN} recorded ${digest}." >&2
            exit 1
          fi
          echo "Releasing ${IMAGE}@${digest} from CI run ${DELIVERY_RUN}."
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: publish release tags
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          git fetch --tags --force origin

          # `latest` means the newest release. A patch release of an older
          # minor version leaves `latest` where it is.
          newest="$(git tag --list 'v*' | sort -V | tail -1)"
          tags=("${GITHUB_REF_NAME}")
          if [ "${newest}" = "${GITHUB_REF_NAME}" ]; then
            tags+=(latest)
          else
            echo "::notice::${GITHUB_REF_NAME} is not the newest v* tag (${newest}); leaving :latest where it is"
          fi

          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "${IMAGE}:${tag}")
          done
          docker buildx imagetools create --prefer-index=false \
            "${arguments[@]}" "${IMAGE}@${DIGEST}"

          for tag in "${tags[@]}"; do
            actual="$(docker buildx imagetools inspect "${IMAGE}:${tag}" |
              awk '$1 == "Digest:" { print $2; exit }')"
            test "${actual}" = "${DIGEST}"
          done
